<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kormoan Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080808;
      --surface:     #111111;
      --surface-2:   #1c1c1c;
      --surface-3:   #242424;
      --border:      #2a2a2a;
      --border-soft: #1e1e1e;
      --text:        #f0f0f0;
      --text-dim:    #888;
      --text-muted:  #555;
      --user-bg:     #f0f0f0;
      --user-text:   #0a0a0a;
      --bot-bg:      #1c1c1c;
      --bot-text:    #e8e8e8;
      --accent-dim:  #aaa;
      --green:       #4ade80;
      --red:         #f87171;
      --radius:      14px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
    }

    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .logo-mark {
      width: 34px; height: 34px; background: var(--text); color: var(--bg);
      font-weight: 700; font-size: 15px; letter-spacing: -0.5px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; flex-shrink: 0;
    }

    .logo-name { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
    .logo-tag  { font-size: 10px; font-weight: 500; color: var(--text-muted);
      letter-spacing: 0.8px; text-transform: uppercase; display: block; margin-top: -1px; }

    .header-status { display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-dim); font-weight: 500; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: pulse 2.4s infinite; }

    .status-dot.busy { background: #fb923c; }

    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

    /* ── Messages ── */
    #messages {
      overflow-y: auto; padding: 28px 28px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome */
    #welcome {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 10px; padding: 16px 0 28px;
      animation: fadeUp .5s ease both;
    }

    #welcome .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 1.8px;
      text-transform: uppercase; color: var(--text-muted); }

    #welcome h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 700;
      letter-spacing: -1px; line-height: 1.15; }

    #welcome h1 em { font-style: normal; color: var(--text-muted); }

    #welcome p { font-size: 14px; color: var(--text-dim); max-width: 460px; line-height: 1.7; }

    /* Message row */
    .msg-row { display: flex; gap: 10px; animation: fadeUp .22s ease both; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-row + .msg-row { margin-top: 3px; }
    .msg-row.bot + .msg-row.user,
    .msg-row.user + .msg-row.bot { margin-top: 14px; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px) }
      to   { opacity:1; transform:translateY(0) }
    }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; align-self: flex-end; margin-bottom: 1px;
    }

    .msg-row.bot  .msg-avatar { background: var(--surface-2); color: var(--text); }
    .msg-row.user .msg-avatar { background: var(--surface-3); color: var(--text-dim); }

    .msg-bubble {
      padding: 11px 15px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.65;
      max-width: min(76%, 580px); word-break: break-word;
    }

    .msg-row.bot  .msg-bubble { background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }
    .msg-row.user .msg-bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg-row.error .msg-bubble { background: rgba(248,113,113,.08); color: var(--red);
      border: 1px solid rgba(248,113,113,.2); border-bottom-left-radius: 4px; }

    /* Markdown */
    .msg-bubble p { margin-bottom: 7px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong { font-weight: 600; }
    .msg-bubble ul,.msg-bubble ol { padding-left: 17px; margin: 5px 0; }
    .msg-bubble li { margin-bottom: 3px; }
    .msg-bubble code { background: rgba(255,255,255,.07); padding: 1px 5px;
      border-radius: 4px; font-size: 12px; font-family: 'SF Mono','Fira Code',monospace; }
    .msg-bubble a { color: var(--accent-dim); text-decoration: underline; text-underline-offset: 3px; }
    .msg-bubble h2,.msg-bubble h3 { font-size: 13px; font-weight: 600; margin: 9px 0 3px; }
    .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 9px 0; }

    /* Typing indicator (injected into #messages by JS) */
    .typing-row { display: flex; gap: 10px; margin-top: 14px; animation: fadeUp .2s ease both; }

    .typing-bubble {
      background: var(--bot-bg); padding: 13px 17px;
      border-radius: var(--radius); border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }

    .typing-dot { width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); animation: tdot 1.3s infinite; }
    .typing-dot:nth-child(2) { animation-delay: .18s; }
    .typing-dot:nth-child(3) { animation-delay: .36s; }

    @keyframes tdot {
      0%,80%,100% { transform:translateY(0); opacity:.35 }
      40%         { transform:translateY(-5px); opacity:1 }
    }

    /* ── Bottom panel ── */
    #bottom { border-top: 1px solid var(--border-soft); background: var(--bg); }

    /* Suggestions */
    #suggestions {
      display: flex; flex-wrap: wrap; gap: 7px;
      padding: 12px 28px 0;
      transition: opacity .25s, max-height .3s;
      max-height: 200px; overflow: hidden;
    }

    #suggestions.hidden { max-height: 0; padding-top: 0; opacity: 0; pointer-events: none; }

    .chip {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 7px 13px; border-radius: 100px; font-size: 12.5px; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: border-color .15s, color .15s, background .15s;
    }
    .chip:hover { border-color: var(--text-muted); color: var(--text); background: var(--surface-2); }

    /* Input */
    #input-area { padding: 12px 28px 20px; }

    .input-wrap {
      display: flex; align-items: flex-end; gap: 9px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--text-muted); }

    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: inherit;
      resize: none; max-height: 110px; line-height: 1.6; overflow-y: auto;
    }
    #user-input::placeholder { color: var(--text-muted); }
    #user-input::-webkit-scrollbar { width: 0; }

    /* Send button */
    #send-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none;
      background: var(--text); color: var(--bg);
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s, transform .15s, background .15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-dim); transform: scale(1.05); }
    #send-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 15px; height: 15px; display: block; }

    /* Spinner ring */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.2);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    .input-hint { margin-top: 7px; font-size: 11px; color: var(--text-muted); text-align: center; }
    kbd { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; font-size: 10px; font-family: inherit; }

    /* Mobile */
    @media (max-width: 600px) {
      header, #messages, #suggestions, #input-area { padding-left: 16px; padding-right: 16px; }
      .msg-bubble { max-width: 88%; }
      #welcome h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <a href="https://parking.sistem.app" target="_blank" class="logo">
      <div class="logo-mark">P</div>
      <div>
        <div class="logo-name">Sistem Parking</div>
        <span class="logo-tag">Agent</span>
      </div>
    </a>
    <div class="header-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label">Online</span>
    </div>
  </header>

  <div id="messages">
    <div id="welcome">
      <span class="eyebrow">Sistem Parking Intelligence</span>
      <h1>How can we<br /><em>help you today?</em></h1>
      <p>Ask anything about our parking management solutions, pricing, integrations, features, or help center documentation.</p>
    </div>
  </div>

  <div id="bottom">
    <div id="suggestions">
      <button class="chip" data-msg="What parking solutions do you offer?">Parking Solutions</button>
      <button class="chip" data-msg="Tell me about Sistem Parking pricing">Pricing Plans</button>
      <button class="chip" data-msg="How do I view invoices and manage billing?">Billing & Invoices</button>
      <button class="chip" data-msg="What solutions do you offer for Airports and Transit Hubs?">Airports & Transit Hubs</button>
      <button class="chip" data-msg="How do I book a demo?">Book a Demo</button>
    </div>

    <div id="input-area">
      <div class="input-wrap">
        <textarea id="user-input" rows="1" placeholder="Ask Kormoan Intelligence…"
          maxlength="1000" aria-label="Your message"></textarea>
        <button id="send-btn" aria-label="Send message" disabled>
          <!-- send icon -->
          <svg id="icon-send" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="input-hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line</p>
    </div>
  </div>

</div>
<script>
(function () {
  'use strict';

  const API_URL = window.location.origin + '/api/chat';

  marked.setOptions({ breaks: true, gfm: true });

  // Session
  function sessionId() {
    const K = 'ka_sid';
    return sessionStorage.getItem(K) || (() => {
      const id = 'ks_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem(K, id);
      return id;
    })();
  }

  // Elements
  const messagesEl = document.getElementById('messages');
  const welcomeEl  = document.getElementById('welcome');
  const suggestEl  = document.getElementById('suggestions');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const iconSend   = document.getElementById('icon-send');
  const statusDot  = document.getElementById('status-dot');
  const statusLbl  = document.getElementById('status-label');

  let loading = false;
  let started = false;

  // ── Helpers ──────────────────────────────────────────────
  function scrollBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function setStatus(busy) {
    statusDot.classList.toggle('busy', busy);
    statusLbl.textContent = busy ? 'Thinking…' : 'Online';
  }

  function setLoadingUI(on) {
    loading = on;
    inputEl.disabled = on;
    if (on) {
      sendBtn.disabled = true;
      iconSend.style.display = 'none';
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      spinner.id = 'btn-spinner';
      sendBtn.appendChild(spinner);
    } else {
      const s = document.getElementById('btn-spinner');
      if (s) s.remove();
      iconSend.style.display = '';
      sendBtn.disabled = inputEl.value.trim().length === 0;
    }
    setStatus(on);
  }

  function appendMessage(role, html) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'user' ? 'U' : 'K';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (role === 'bot') {
      bubble.innerHTML = marked.parse(html);
      bubble.querySelectorAll('a').forEach(a => { a.target='_blank'; a.rel='noopener noreferrer'; });
    } else if (role === 'error') {
      bubble.textContent = html;
    } else {
      bubble.textContent = html;
    }

    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing-indicator';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.cssText = 'background:var(--surface-2);color:var(--text);border-radius:7px;font-size:11px;font-weight:700';
    av.textContent = 'K';

    row.innerHTML = `
      <div class="msg-avatar" style="background:var(--surface-2);color:var(--text);border-radius:7px;font-size:11px;font-weight:700;align-self:flex-end;margin-bottom:1px">K</div>
      <div class="typing-bubble">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>`;

    messagesEl.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function hideWelcome() {
    if (!welcomeEl) return;
    welcomeEl.style.transition = 'opacity .3s';
    welcomeEl.style.opacity = '0';
    setTimeout(() => welcomeEl.remove(), 300);
  }

  function hideSuggestions() {
    suggestEl.classList.add('hidden');
  }

  // ── Send ─────────────────────────────────────────────────
  async function send(text) {
    text = (text || '').trim();
    if (loading || !text) return;

    if (!started) {
      started = true;
      hideWelcome();
      hideSuggestions();
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';
    setLoadingUI(true);

    appendMessage('user', text);
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId(), message: text, pageUrl: location.href }),
      });

      const data = await res.json();
      hideTyping();

      if (data.response) {
        appendMessage('bot', data.response);
      } else {
        appendMessage('error', data.error || 'Something went wrong. Please try again.');
      }
    } catch {
      hideTyping();
      appendMessage('error', "Can't connect right now. Check your connection and try again.");
    } finally {
      setLoadingUI(false);
      inputEl.focus();
    }
  }

  // ── Events ────────────────────────────────────────────────
  inputEl.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    if (!loading) sendBtn.disabled = this.value.trim().length === 0;
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(this.value); }
  });

  sendBtn.addEventListener('click', () => send(inputEl.value));

  suggestEl.querySelectorAll('.chip').forEach(btn =>
    btn.addEventListener('click', () => send(btn.dataset.msg))
  );

  inputEl.focus();
})();
</script>
</body>
</html>
